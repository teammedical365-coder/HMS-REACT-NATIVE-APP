name: React Native Android Build

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID'
        required: true
      hospitalName:
        description: 'Hospital Name'
        required: true
      applicationId:
        description: 'Android Application ID (e.g. com.medical365.xyz)'
        required: true
      logoUrl:
        description: 'URL of the Hospital Logo'
        required: true
      themeColor:
        description: 'Primary Theme Color Hex (e.g. #14b8a6)'
        required: true
      rnBuildId:
        description: 'RN Build Correlation ID'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rn-build-${{ github.event.inputs.tenantId }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Inputs
        env:
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
          APP_ID: ${{ github.event.inputs.applicationId }}
          THEME_COLOR: ${{ github.event.inputs.themeColor }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$TENANT_ID" ]; then
            echo "::error::tenantId is required and cannot be empty"
            exit 1
          fi

          if [ -z "$HOSPITAL_NAME" ]; then
            echo "::error::hospitalName is required and cannot be empty"
            exit 1
          fi

          if ! [[ "$APP_ID" =~ ^com\.medical365\.[a-z][a-z0-9_]*$ ]]; then
            echo "::error::Invalid applicationId. Expected com.medical365.<lowercase-segment>."
            exit 1
          fi

          if ! [[ "$THEME_COLOR" =~ ^#[0-9a-fA-F]{6}$ ]]; then
            echo "::error::Invalid themeColor. Expected #RRGGBB."
            exit 1
          fi

          if ! [[ "$RN_BUILD_ID" =~ ^rn-[0-9]+-[a-f0-9]{8}$ ]]; then
            echo "::error::Invalid rnBuildId format."
            exit 1
          fi

          echo "Input validation passed."
          echo "Received and validated rnBuildId: $RN_BUILD_ID"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update app.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const hospitalName = context.payload.inputs.hospitalName;
            const applicationId = context.payload.inputs.applicationId;
            const tenantId = context.payload.inputs.tenantId;

            if (!fs.existsSync(appJsonPath)) {
              core.setFailed(`app.json not found at ${appJsonPath}`);
              return;
            }

            let config;
            try {
              config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            } catch (error) {
              core.setFailed(`Failed to parse app.json: ${error.message}`);
              return;
            }

            if (!config.expo) config.expo = {};

            config.expo.name = hospitalName;

            let slug = String(hospitalName)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');

            if (!slug) {
              const safeTenant = String(tenantId)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
              slug = `hospital-${safeTenant || 'app'}`;
            }

            slug = slug.substring(0, 50).replace(/-+$/, '') || 'hospital-app';
            config.expo.slug = slug;

            // Wire app icon to white-label asset
            config.expo.icon = './assets/icon.png';

            if (!config.expo.android) config.expo.android = {};
            config.expo.android.package = applicationId;
            config.expo.android.icon = './assets/icon.png';

            // Ensure adaptiveIcon does not override hospital logo with a default icon
            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }
            config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            if (config.expo.ios) {
              config.expo.ios.bundleIdentifier = applicationId;
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Updated app.json: name=${hospitalName}, slug=${slug}, package=${applicationId}, icon=${config.expo.icon}`);

      - name: Download & Process Logo
        env:
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
        run: |
          set -euo pipefail

          CANONICAL_LOGO="HMS-REACT-NATIVE/assets/medical365-logo.png"
          RAW_FILE="HMS-REACT-NATIVE/assets/icon_raw"
          PNG_FILE="HMS-REACT-NATIVE/assets/icon.png"
          SPLASH_FILE="HMS-REACT-NATIVE/assets/splash.png"
          ADAPTIVE_FILE="HMS-REACT-NATIVE/assets/adaptive-icon.png"
          MAX_LOGO_BYTES=5242880

          mkdir -p HMS-REACT-NATIVE/assets

          # Verify canonical Medical365 logo exists
          if [ ! -s "$CANONICAL_LOGO" ]; then
            echo "::error::Canonical Medical365 logo missing at $CANONICAL_LOGO"
            exit 1
          fi

          generate_adaptive_icon() {
            local src="$1"
            local dest="$2"
            echo "Generating Android adaptive icon foreground with safe-zone padding..."
            if command -v magick >/dev/null 2>&1; then
              magick -size 1024x1024 xc:none \( "$src" -resize 720x720\> \) -gravity center -composite "$dest"
            elif command -v convert >/dev/null 2>&1; then
              convert -size 1024x1024 xc:none \( "$src" -resize 720x720\> \) -gravity center -composite "$dest"
            elif python3 -c "import PIL" >/dev/null 2>&1; then
              python3 -c "from PIL import Image; img = Image.open('$src').convert('RGBA'); canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0)); resample = getattr(Image, 'Resampling', Image).LANCZOS if hasattr(Image, 'Resampling') else getattr(Image, 'ANTIALIAS', 1); img.thumbnail((720, 720), resample); canvas.paste(img, ((1024 - img.width) // 2, (1024 - img.height) // 2), img); canvas.save('$dest', 'PNG')"
            else
              cp -f "$src" "$dest"
            fi

            if [ ! -s "$dest" ]; then
              cp -f "$src" "$dest"
            fi
          }

          IS_WHITE_LABEL=false

          LOGO_URL_LOWER=$(echo "${LOGO_URL:-}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ -n "$LOGO_URL_LOWER" ] && [ "$LOGO_URL_LOWER" != "default" ] && [ "$LOGO_URL_LOWER" != "none" ] && [ "$LOGO_URL_LOWER" != "null" ]; then
            echo "White-label logo candidate detected: attempting to fetch and validate..."
            DOWNLOAD_SUCCESS=false

            if [[ "$LOGO_URL" == data:image/* ]]; then
              echo "Processing Base64 logo..."
              if printf '%s' "$LOGO_URL" | grep -Eq '^data:image/(png|jpeg|jpg|webp);base64,'; then
                BASE64_DATA="${LOGO_URL#*;base64,}"
                if printf '%s' "$BASE64_DATA" | base64 --decode > "$RAW_FILE" 2>/dev/null; then
                  DOWNLOAD_SUCCESS=true
                else
                  echo "::warning::Failed to decode Base64 logo data."
                fi
              else
                echo "::warning::Malformed or unsupported data URL."
              fi

            elif [[ "$LOGO_URL" == /* ]] || [[ "$LOGO_URL" == https://* ]] || [[ "$LOGO_URL" == http://* ]]; then
              TARGET_URL="$LOGO_URL"
              if [[ "$LOGO_URL" == /* ]]; then
                TARGET_URL="https://hms-n6nk.onrender.com${LOGO_URL}"
              fi

              echo "Downloading logo from configured URL: $TARGET_URL"
              if curl -f -L -sS \
                --connect-timeout 15 \
                --max-time 30 \
                --max-filesize "$MAX_LOGO_BYTES" \
                "$TARGET_URL" -o "$RAW_FILE"; then
                DOWNLOAD_SUCCESS=true
              else
                echo "::warning::Failed to download logo from $TARGET_URL"
              fi
            else
              echo "::warning::Unsupported logo URL format: $LOGO_URL"
            fi

            if [ "$DOWNLOAD_SUCCESS" = "true" ] && [ -s "$RAW_FILE" ]; then
              FILE_SIZE=$(wc -c < "$RAW_FILE" | tr -d ' ')
              if [ "$FILE_SIZE" -gt 0 ] && [ "$FILE_SIZE" -le "$MAX_LOGO_BYTES" ]; then
                MIME_TYPE=$(file -b --mime-type "$RAW_FILE" || true)
                echo "Detected candidate logo MIME type: $MIME_TYPE"

                CONVERT_SUCCESS=false
                case "$MIME_TYPE" in
                  image/png)
                    cp -f "$RAW_FILE" "$PNG_FILE"
                    CONVERT_SUCCESS=true
                    ;;
                  image/jpeg|image/webp)
                    if command -v magick >/dev/null 2>&1; then
                      magick "$RAW_FILE" "$PNG_FILE" && CONVERT_SUCCESS=true
                    elif command -v convert >/dev/null 2>&1; then
                      convert "$RAW_FILE" "$PNG_FILE" && CONVERT_SUCCESS=true
                    elif python3 -c "import PIL" >/dev/null 2>&1; then
                      python3 -c "from PIL import Image; Image.open('$RAW_FILE').convert('RGBA').save('$PNG_FILE', 'PNG')" && CONVERT_SUCCESS=true
                    fi
                    ;;
                esac

                if [ "$CONVERT_SUCCESS" = "true" ] && [ -s "$PNG_FILE" ]; then
                  FINAL_MIME=$(file -b --mime-type "$PNG_FILE" || true)
                  FINAL_SIZE=$(wc -c < "$PNG_FILE" | tr -d ' ')
                  if [ "$FINAL_MIME" = "image/png" ] && [ "$FINAL_SIZE" -gt 0 ]; then
                    IS_WHITE_LABEL=true
                  fi
                fi
              fi
            fi
          fi

          if [ "$IS_WHITE_LABEL" = "true" ]; then
            echo "Using hospital white-label logo"
          else
            echo "White-label unavailable; using Medical365 logo"
            cp -f "$CANONICAL_LOGO" "$PNG_FILE"
          fi

          cp -f "$PNG_FILE" "$SPLASH_FILE"
          generate_adaptive_icon "$PNG_FILE" "$ADAPTIVE_FILE"

          if [ ! -s "$PNG_FILE" ]; then
            echo "::error::Final icon.png is missing or empty"
            exit 1
          fi

          if [ ! -s "$ADAPTIVE_FILE" ]; then
            echo "::error::Final adaptive-icon.png is missing or empty"
            exit 1
          fi

          if [ "$IS_WHITE_LABEL" = "true" ]; then
            echo "SELECTED_ICON_SOURCE=WHITE_LABEL" >> "$GITHUB_ENV"
          else
            echo "SELECTED_ICON_SOURCE=MEDICAL365" >> "$GITHUB_ENV"
          fi

          echo "Logo, splash, and adaptive icon successfully prepared and validated."

      - name: Verify and Apply App Icons in app.json
        uses: actions/github-script@v7
        env:
          SELECTED_ICON_SOURCE: ${{ env.SELECTED_ICON_SOURCE }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const iconPath = 'HMS-REACT-NATIVE/assets/icon.png';
            const adaptivePath = 'HMS-REACT-NATIVE/assets/adaptive-icon.png';
            const canonicalPath = 'HMS-REACT-NATIVE/assets/medical365-logo.png';
            const selectedSource = process.env.SELECTED_ICON_SOURCE || 'UNKNOWN';

            if (!fs.existsSync(iconPath) || fs.statSync(iconPath).size === 0) {
              core.setFailed(`Required icon asset missing or empty at ${iconPath}`);
              return;
            }

            if (!fs.existsSync(adaptivePath) || fs.statSync(adaptivePath).size === 0) {
              core.setFailed(`Required adaptive icon asset missing or empty at ${adaptivePath}`);
              return;
            }

            const getHash = (filePath) => {
              const buffer = fs.readFileSync(filePath);
              return crypto.createHash('sha256').update(buffer).digest('hex');
            };

            const iconHash = getHash(iconPath);
            const canonicalHash = fs.existsSync(canonicalPath) ? getHash(canonicalPath) : null;

            if (selectedSource === 'MEDICAL365') {
              if (iconHash !== canonicalHash) {
                core.setFailed(`Validation failed: Selected source is MEDICAL365, but ${iconPath} does not match canonical ${canonicalPath}`);
                return;
              }
              core.info(`Icon validation passed: ${iconPath} verified against canonical Medical365 logo.`);
            } else if (selectedSource === 'WHITE_LABEL') {
              if (canonicalHash && iconHash === canonicalHash) {
                core.setFailed(`Validation failed: Selected source is WHITE_LABEL, but ${iconPath} is identical to canonical Medical365 logo instead of hospital logo.`);
                return;
              }
              core.info(`Icon validation passed: ${iconPath} verified as custom hospital white-label logo.`);
            } else {
              core.warning(`Unknown icon source ${selectedSource}; proceeding with existing icon validation.`);
            }

            let config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            if (!config.expo) config.expo = {};
            if (!config.expo.android) config.expo.android = {};

            config.expo.icon = './assets/icon.png';
            config.expo.android.icon = './assets/icon.png';

            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }

            if (fs.existsSync(adaptivePath)) {
              config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            } else {
              config.expo.android.adaptiveIcon.foregroundImage = './assets/icon.png';
            }

            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Configured app.json launcher icons for source=${selectedSource}: icon=${config.expo.icon}, adaptiveForeground=${config.expo.android.adaptiveIcon.foregroundImage}, adaptiveBg=${config.expo.android.adaptiveIcon.backgroundColor}`);

      - name: Build APK and AAB via Expo Prebuild
        id: build_release
        working-directory: ./HMS-REACT-NATIVE
        env:
          EXPO_PUBLIC_TENANT_ID: ${{ github.event.inputs.tenantId }}
          EXPO_PUBLIC_API_URL: https://hms-n6nk.onrender.com
          EXPO_PUBLIC_THEME_COLOR: ${{ github.event.inputs.themeColor }}
        run: |
          set -euo pipefail

          npm ci

          printf 'EXPO_PUBLIC_TENANT_ID=%s\n' "$EXPO_PUBLIC_TENANT_ID" > .env.local
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" >> .env.local
          printf 'EXPO_PUBLIC_THEME_COLOR=%s\n' "$EXPO_PUBLIC_THEME_COLOR" >> .env.local

          npx expo prebuild --platform android --clean --no-install

          cd android
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Find and Move Artifacts
        id: collect_artifacts
        run: |
          set -euo pipefail

          mkdir -p output_artifacts

          APK_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FOUND" ] || [ ! -s "$APK_FOUND" ]; then
            echo "::error::Release APK was not generated or is empty"
            exit 1
          fi
          cp "$APK_FOUND" output_artifacts/app-rn.apk

          AAB_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          if [ -z "$AAB_FOUND" ] || [ ! -s "$AAB_FOUND" ]; then
            echo "::error::Release AAB was not generated or is empty"
            exit 1
          fi
          cp "$AAB_FOUND" output_artifacts/app-rn.aab

          file output_artifacts/app-rn.apk output_artifacts/app-rn.aab
          ls -lh output_artifacts/

      - name: Upload Build Artifacts (APK and AAB)
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hospital-rn-app-${{ github.event.inputs.tenantId }}-${{ github.event.inputs.rnBuildId }}
          path: |
            output_artifacts/app-rn.apk
            output_artifacts/app-rn.aab
          if-no-files-found: error

      - name: Notify Backend Webhook (Success)
        id: notify_success
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          if [ ! -s "output_artifacts/app-rn.apk" ] || [ ! -s "output_artifacts/app-rn.aab" ]; then
            echo "::error::Required APK/AAB artifacts are missing or empty"
            exit 1
          fi

          echo "Sending rnBuildId: $RN_BUILD_ID to success upload webhook"

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rn-webhook-response.txt \
            -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 90 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn/upload-build?secret=${WEBHOOK_SECRET}&tenantId=${TENANT_ID}&rnBuildId=${RN_BUILD_ID}" \
            -F "apk=@output_artifacts/app-rn.apk" \
            -F "aab=@output_artifacts/app-rn.aab" \
            -F "tenantId=${TENANT_ID}" \
            -F "rnBuildId=${RN_BUILD_ID}")

          echo "Backend HTTP status: $HTTP_STATUS"
          echo "Backend response:"
          cat /tmp/rn-webhook-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::RN success webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "RN success webhook completed successfully."

      - name: Notify Backend Webhook (Failure)
        if: failure() && steps.notify_success.outcome != 'failure'
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          echo "Sending rnBuildId: $RN_BUILD_ID to failure webhook"

          curl -f -sS \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn?secret=${WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"tenantId\":\"${TENANT_ID}\",\"rnBuildId\":\"${RN_BUILD_ID}\",\"status\":\"FAILED\",\"error\":\"RN GitHub Action workflow failed\"}"
