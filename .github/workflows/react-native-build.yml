name: React Native Android Build

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID'
        required: true
      hospitalName:
        description: 'Hospital Name'
        required: true
      applicationId:
        description: 'Android Application ID (e.g. com.medical365.xyz)'
        required: true
      logoUrl:
        description: 'URL of the Hospital Logo'
        required: true
      themeColor:
        description: 'Primary Theme Color Hex (e.g. #14b8a6)'
        required: true
      rnBuildId:
        description: 'RN Build Correlation ID'
        required: true
      versionCode:
        description: 'Native Android Version Code (integer > 0)'
        required: false
        default: '1'
      versionName:
        description: 'Native Android Version Name (semver, e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      targetCommitSha:
        description: 'Target Git commit SHA to checkout and build from'
        required: false
        default: ''
      releaseId:
        description: 'Backend Release ID for correlation and release artifact tracking'
        required: false
        default: ''
      signingMode:
        description: 'Signing mode: "legacy_debug" (default) or "production" (signed with production release keystore)'
        required: false
        default: 'legacy_debug'
      uploadToBackend:
        description: 'Controls whether artifacts are uploaded to the backend and completion/failure callbacks are sent'
        required: false
        default: 'true'

env:
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    concurrency:
      group: rn-build-${{ github.event.inputs.tenantId }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.targetCommitSha || github.ref }}

      - name: Validate Inputs
        env:
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
          APP_ID: ${{ github.event.inputs.applicationId }}
          THEME_COLOR: ${{ github.event.inputs.themeColor }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
          VERSION_CODE: ${{ github.event.inputs.versionCode || '1' }}
          VERSION_NAME: ${{ github.event.inputs.versionName || '1.0.0' }}
          SIGNING_MODE: ${{ github.event.inputs.signingMode || 'legacy_debug' }}
          UPLOAD_TO_BACKEND: ${{ github.event.inputs.uploadToBackend || 'true' }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Mandatory EAS_PROJECT_ID is missing from repository variables (vars.EAS_PROJECT_ID)."
            exit 1
          fi

          if ! [[ "$EAS_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Configured EAS_PROJECT_ID is invalid: expected 36-character UUID format."
            exit 1
          fi

          if [ "$EAS_PROJECT_ID" = "00000000-0000-0000-0000-000000000000" ] || [ "$EAS_PROJECT_ID" = "YOUR_EAS_PROJECT_ID" ]; then
            echo "::error::Configured EAS_PROJECT_ID is a placeholder and cannot be used for base APK release."
            exit 1
          fi

          if [ -z "$TENANT_ID" ]; then
            echo "::error::tenantId is required and cannot be empty"
            exit 1
          fi

          if [ -z "$HOSPITAL_NAME" ]; then
            echo "::error::hospitalName is required and cannot be empty"
            exit 1
          fi

          if ! [[ "$APP_ID" =~ ^com\.medical365\.[a-z][a-z0-9_]*$ ]]; then
            echo "::error::Invalid applicationId. Expected com.medical365.<lowercase-segment>."
            exit 1
          fi

          if ! [[ "$THEME_COLOR" =~ ^#[0-9a-fA-F]{6}$ ]]; then
            echo "::error::Invalid themeColor. Expected #RRGGBB."
            exit 1
          fi

          if ! [[ "$RN_BUILD_ID" =~ ^rn-[0-9]+-[a-f0-9]{8}$ ]]; then
            echo "::error::Invalid rnBuildId format."
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid versionCode '$VERSION_CODE'. Expected positive integer."
            exit 1
          fi

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::versionCode '$VERSION_CODE' exceeds Android maximum limit (2100000000)."
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName '$VERSION_NAME'. Expected semantic version (e.g. 1.0.0)."
            exit 1
          fi

          if [ "$SIGNING_MODE" != "legacy_debug" ] && [ "$SIGNING_MODE" != "production" ]; then
            echo "::error::Invalid signingMode '$SIGNING_MODE'. Expected 'legacy_debug' or 'production'."
            exit 1
          fi

          if [ "$UPLOAD_TO_BACKEND" != "true" ] && [ "$UPLOAD_TO_BACKEND" != "false" ]; then
            echo "::error::Invalid uploadToBackend '$UPLOAD_TO_BACKEND'. Expected 'true' or 'false'."
            exit 1
          fi

          echo "Input validation passed."
          echo "Received and validated rnBuildId: $RN_BUILD_ID"
          echo "Validated native versionCode: $VERSION_CODE"
          echo "Validated native versionName: $VERSION_NAME"
          echo "Selected signingMode: $SIGNING_MODE"
          echo "Upload to backend: $UPLOAD_TO_BACKEND"

      - name: Prepare Production Keystore
        id: setup_keystore
        if: ${{ (github.event.inputs.signingMode || 'legacy_debug') == 'production' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS secret is not configured in repository secrets."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD secret is not configured in repository secrets."
            exit 1
          fi

          KEYSTORE_DIR="${{ runner.temp }}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/release.keystore"

          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty or corrupted."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "PRODUCTION_RELEASE_BUILD=true" >> $GITHUB_ENV
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "Production keystore staged securely at $KEYSTORE_FILE with 600 permissions."

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./HMS-REACT-NATIVE
        run: npm ci

      - name: Update app.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const hospitalName = context.payload.inputs.hospitalName;
            const applicationId = context.payload.inputs.applicationId;
            const tenantId = context.payload.inputs.tenantId;

            if (!fs.existsSync(appJsonPath)) {
              core.setFailed(`app.json not found at ${appJsonPath}`);
              return;
            }

            let config;
            try {
              config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            } catch (error) {
              core.setFailed(`Failed to parse app.json: ${error.message}`);
              return;
            }

            if (!config.expo) config.expo = {};

            config.expo.name = hospitalName;

            let slug = String(hospitalName)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');

            if (!slug) {
              const safeTenant = String(tenantId)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
              slug = `hospital-${safeTenant || 'app'}`;
            }

            slug = slug.substring(0, 50).replace(/-+$/, '') || 'hospital-app';
            config.expo.slug = slug;

            // Wire app icon to white-label asset
            config.expo.icon = './assets/icon.png';

            // Configure native Android versionCode and semantic versionName (Phase 3)
            const rawVersionCode = context.payload.inputs.versionCode;
            const rawVersionName = context.payload.inputs.versionName;

            const parsedVersionCode = (rawVersionCode && /^[1-9][0-9]*$/.test(String(rawVersionCode).trim()))
              ? parseInt(String(rawVersionCode).trim(), 10)
              : (config.expo.android?.versionCode || 1);
            const parsedVersionName = (rawVersionName && String(rawVersionName).trim())
              ? String(rawVersionName).trim()
              : (config.expo.version || '1.0.0');

            config.expo.version = parsedVersionName;

            if (!config.expo.android) config.expo.android = {};
            config.expo.android.package = applicationId;
            config.expo.android.versionCode = parsedVersionCode;
            config.expo.android.icon = './assets/icon.png';

            // Ensure adaptiveIcon does not override hospital logo with a default icon
            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }
            config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            if (config.expo.ios) {
              config.expo.ios.bundleIdentifier = applicationId;
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Updated app.json: name=${hospitalName}, slug=${slug}, package=${applicationId}, versionCode=${parsedVersionCode}, version=${parsedVersionName}, icon=${config.expo.icon}`);

            // Inject white-label tenant identity into src/tenant.js
            const tenantJsPath = 'HMS-REACT-NATIVE/src/tenant.js';
            const escapedName = hospitalName.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const tenantCode = `export const HARDCODED_TENANT = { tenantId: "${tenantId}", slug: "${slug}", name: "${escapedName}" };\n`;
            fs.writeFileSync(tenantJsPath, tenantCode);
            core.info(`Injected white-label tenant config to ${tenantJsPath}: ${tenantCode.trim()}`);

            core.exportVariable('EXPO_PUBLIC_HOSPITAL_NAME', hospitalName);
            core.exportVariable('EXPO_PUBLIC_TENANT_SLUG', slug);
            core.exportVariable('APPLICATION_ID', applicationId);
            core.exportVariable('VERSION_CODE', String(parsedVersionCode));
            core.exportVariable('VERSION_NAME', parsedVersionName);

      - name: Download & Process Logo
        working-directory: ./HMS-REACT-NATIVE
        env:
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
          EXPO_PUBLIC_HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
        run: |
          set -euo pipefail
          node scripts/prepare-launcher-icons.js "${LOGO_URL}" --clean-mipmaps --generate-native-res --hospital-name "${{ github.event.inputs.hospitalName }}"

      - name: Verify and Apply App Icons in app.json
        uses: actions/github-script@v7
        env:
          SELECTED_ICON_SOURCE: ${{ env.SELECTED_ICON_SOURCE }}
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
        with:
          script: |
            const fs = require('fs');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const iconPath = 'HMS-REACT-NATIVE/assets/icon.png';
            const adaptivePath = 'HMS-REACT-NATIVE/assets/adaptive-icon.png';
            const selectedSource = process.env.SELECTED_ICON_SOURCE || 'UNKNOWN';
            const rawLogo = (process.env.LOGO_URL || '').trim();

            if (!fs.existsSync(iconPath) || fs.statSync(iconPath).size === 0) {
              core.setFailed(`Required icon asset missing or empty at ${iconPath}`);
              return;
            }

            if (!fs.existsSync(adaptivePath) || fs.statSync(adaptivePath).size === 0) {
              core.setFailed(`Required adaptive icon asset missing or empty at ${adaptivePath}`);
              return;
            }

            const isCustomCandidate = rawLogo.length > 0 && !['default', 'none', 'null'].includes(rawLogo.toLowerCase());
            if (isCustomCandidate && selectedSource !== 'WHITE_LABEL') {
              core.setFailed(`Hospital custom logo URL "${rawLogo}" failed to produce WHITE_LABEL icon asset (resolved source: ${selectedSource})`);
              return;
            }

            core.info(`Icon validation passed: ${iconPath} (${fs.statSync(iconPath).size} bytes), ${adaptivePath} (${fs.statSync(adaptivePath).size} bytes) for source=${selectedSource}`);

            let config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            if (!config.expo) config.expo = {};
            if (!config.expo.android) config.expo.android = {};

            config.expo.icon = './assets/icon.png';
            config.expo.android.icon = './assets/icon.png';

            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }

            config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Configured app.json launcher icons for source=${selectedSource}: icon=${config.expo.icon}, adaptiveForeground=${config.expo.android.adaptiveIcon.foregroundImage}, adaptiveBg=${config.expo.android.adaptiveIcon.backgroundColor}`);

      - name: Build APK and AAB via Expo Prebuild
        id: build_release
        working-directory: ./HMS-REACT-NATIVE
        env:
          EXPO_PUBLIC_TENANT_ID: ${{ github.event.inputs.tenantId }}
          EXPO_PUBLIC_HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
          EXPO_PUBLIC_TENANT_SLUG: ${{ env.EXPO_PUBLIC_TENANT_SLUG }}
          APPLICATION_ID: ${{ github.event.inputs.applicationId }}
          EXPO_PUBLIC_API_URL: https://hms-n6nk.onrender.com
          EXPO_PUBLIC_THEME_COLOR: ${{ github.event.inputs.themeColor }}
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
          VERSION_CODE: ${{ env.VERSION_CODE || github.event.inputs.versionCode || '1' }}
          VERSION_NAME: ${{ env.VERSION_NAME || github.event.inputs.versionName || '1.0.0' }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          REQUIRE_OTA_CONFIG: 'true'
          REQUIRE_TENANT_CONFIG: 'true'
        run: |
          set -euo pipefail

          printf 'EXPO_PUBLIC_TENANT_ID=%s\n' "$EXPO_PUBLIC_TENANT_ID" > .env.local
          printf 'EXPO_PUBLIC_HOSPITAL_NAME=%s\n' "$EXPO_PUBLIC_HOSPITAL_NAME" >> .env.local
          printf 'EXPO_PUBLIC_TENANT_SLUG=%s\n' "$EXPO_PUBLIC_TENANT_SLUG" >> .env.local
          printf 'APPLICATION_ID=%s\n' "$APPLICATION_ID" >> .env.local
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" >> .env.local
          printf 'EXPO_PUBLIC_THEME_COLOR=%s\n' "$EXPO_PUBLIC_THEME_COLOR" >> .env.local

          # Clean any stale mipmap icons before expo prebuild to ensure tenant isolation
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*

          # Fail immediately before prebuild if mandatory OTA release configuration is missing or invalid
          node scripts/verify-base-apk-ota-config.js --pre-build

          npx expo prebuild --platform android --clean --no-install

          # Fail immediately before Gradle if native AndroidManifest is missing required Expo Updates meta-data
          node scripts/verify-base-apk-ota-config.js --post-prebuild

          # Ensure safe release signing configuration is present in android/app/build.gradle
          node scripts/configure-release-signing.js

          # Ensure authoritative launcher mipmaps and splash drawables are placed directly in native Android resources
          node scripts/prepare-launcher-icons.js "${LOGO_URL}" --clean-mipmaps --generate-native-res --use-cached --hospital-name "$EXPO_PUBLIC_HOSPITAL_NAME"

          cd android
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Find and Move Artifacts
        id: collect_artifacts
        run: |
          set -euo pipefail

          mkdir -p output_artifacts

          APK_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FOUND" ] || [ ! -s "$APK_FOUND" ]; then
            echo "::error::Release APK was not generated or is empty"
            exit 1
          fi
          cp "$APK_FOUND" output_artifacts/app-rn.apk

          AAB_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          if [ -z "$AAB_FOUND" ] || [ ! -s "$AAB_FOUND" ]; then
            echo "::error::Release AAB was not generated or is empty"
            exit 1
          fi
          cp "$AAB_FOUND" output_artifacts/app-rn.aab

          file output_artifacts/app-rn.apk output_artifacts/app-rn.aab
          ls -lh output_artifacts/

          # Compute SHA-256 checksums for release verification and backend tracking
          cd output_artifacts
          sha256sum app-rn.apk > checksum.sha256
          sha256sum app-rn.aab >> checksum.sha256
          cat checksum.sha256
          APK_SHA=$(sha256sum app-rn.apk | awk '{print $1}')
          AAB_SHA=$(sha256sum app-rn.aab | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA" >> $GITHUB_ENV
          echo "AAB_SHA256=$AAB_SHA" >> $GITHUB_ENV
          cd ..

      - name: Verify APK Signature
        id: verify_signature
        run: |
          set -euo pipefail
          SIGNING_MODE="${{ github.event.inputs.signingMode || 'legacy_debug' }}"
          APK_PATH="output_artifacts/app-rn.apk"
          EXPECTED_PROD_SHA256="9C:28:0C:E7:AC:22:44:CB:7F:1E:EE:B8:0D:B4:E0:7E:49:29:3E:51:7B:9F:4A:3E:76:52:86:F3:CE:46:47:49"

          echo "Verifying cryptographic signature on $APK_PATH (mode: $SIGNING_MODE)..."

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Target APK was not found or is empty at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            if [ "$SIGNING_MODE" = "production" ]; then
              echo "::error::apksigner tool is required for production signature verification but was not found in $ANDROID_HOME/build-tools."
              exit 1
            else
              echo "::warning::apksigner not found in $ANDROID_HOME/build-tools. Skipping signature verification in legacy_debug mode."
              exit 0
            fi
          fi

          if ! VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH"); then
            echo "::error::apksigner verification failed on $APK_PATH"
            exit 1
          fi

          echo "Certificate verification details:"
          echo "$VERIFY_OUTPUT"

          ACTUAL_SHA256_RAW=$(echo "$VERIFY_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | sed -e 's/^.*[sS][hH][aA]-256 digest:[[:space:]]*//' || true)
          ACTUAL_SHA256=$(echo "$ACTUAL_SHA256_RAW" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256=$(echo "$EXPECTED_PROD_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')

          if [ "$SIGNING_MODE" = "production" ]; then
            if [ -z "$ACTUAL_SHA256" ]; then
              echo "::error::CRITICAL SECURITY FAILURE: Could not extract signer SHA-256 digest from apksigner output."
              exit 1
            fi

            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::CRITICAL SECURITY FAILURE: Production APK signer SHA-256 digest ($ACTUAL_SHA256) does not match expected Medical365 release key fingerprint ($EXPECTED_SHA256)!"
              exit 1
            fi

            echo "Production cryptographic signature successfully verified against Medical365 release key ($EXPECTED_SHA256)."
          else
            echo "Legacy debug mode active (signingMode: $SIGNING_MODE). Signer SHA-256: $ACTUAL_SHA256"
          fi

      - name: Upload Build Artifacts (APK and AAB)
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hospital-rn-app-${{ github.event.inputs.tenantId }}-${{ github.event.inputs.rnBuildId }}
          path: |
            output_artifacts/app-rn.apk
            output_artifacts/app-rn.aab
            output_artifacts/checksum.sha256
          if-no-files-found: error

      - name: Upload Build Artifacts to Backend (Phase 1)
        id: upload_artifacts_backend
        if: success() && (github.event.inputs.uploadToBackend != 'false')
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
          RELEASE_ID: ${{ github.event.inputs.releaseId || '' }}
          APK_SHA256: ${{ env.APK_SHA256 || '' }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          if [ ! -s "output_artifacts/app-rn.apk" ] || [ ! -s "output_artifacts/app-rn.aab" ]; then
            echo "::error::Required APK/AAB artifacts are missing or empty"
            exit 1
          fi

          echo "Phase 1: Uploading APK/AAB with rnBuildId: $RN_BUILD_ID (releaseId: ${RELEASE_ID:-none})..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rn-upload-response.txt \
            -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 90 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn/upload-build?secret=${WEBHOOK_SECRET}&tenantId=${TENANT_ID}&rnBuildId=${RN_BUILD_ID}" \
            -F "apk=@output_artifacts/app-rn.apk" \
            -F "aab=@output_artifacts/app-rn.aab" \
            -F "tenantId=${TENANT_ID}" \
            -F "rnBuildId=${RN_BUILD_ID}" \
            -F "releaseId=${RELEASE_ID:-}" \
            -F "checksumSha256=${APK_SHA256:-}")

          echo "Upload HTTP status: $HTTP_STATUS"
          echo "Upload response:"
          cat /tmp/rn-upload-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::RN upload-build webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Phase 1 upload completed successfully (build status is PROCESSING)."

      - name: Final Completion Callback (Phase 2)
        id: notify_completed
        if: success() && (github.event.inputs.uploadToBackend != 'false')
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
          RELEASE_ID: ${{ github.event.inputs.releaseId || '' }}
          APK_SHA256: ${{ env.APK_SHA256 || '' }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          echo "Phase 2: Sending final completion callback for rnBuildId: $RN_BUILD_ID (releaseId: ${RELEASE_ID:-none})..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rn-completed-response.txt \
            -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn?secret=${WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"tenantId\":\"${TENANT_ID}\",\"rnBuildId\":\"${RN_BUILD_ID}\",\"status\":\"COMPLETED\",\"releaseId\":\"${RELEASE_ID:-}\",\"checksumSha256\":\"${APK_SHA256:-}\"}")

          echo "Completion callback HTTP status: $HTTP_STATUS"
          echo "Completion callback response:"
          cat /tmp/rn-completed-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::RN completion webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Phase 2 completion callback acknowledged by backend. Build is now COMPLETED."

      - name: Notify Backend Webhook (Failure)
        if: failure() && steps.notify_completed.outcome != 'success' && (github.event.inputs.uploadToBackend != 'false')
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
          RELEASE_ID: ${{ github.event.inputs.releaseId || '' }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          echo "Sending failure webhook for rnBuildId: $RN_BUILD_ID (releaseId: ${RELEASE_ID:-none})"

          curl -f -sS \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn?secret=${WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"tenantId\":\"${TENANT_ID}\",\"rnBuildId\":\"${RN_BUILD_ID}\",\"status\":\"FAILED\",\"releaseId\":\"${RELEASE_ID:-}\",\"error\":\"RN GitHub Action workflow failed\"}"

      - name: Clean up Keystore
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            shred -u "$ANDROID_KEYSTORE_PATH" 2>/dev/null || rm -f "$ANDROID_KEYSTORE_PATH"
            echo "Production keystore temporary runner file destroyed safely."
          fi
