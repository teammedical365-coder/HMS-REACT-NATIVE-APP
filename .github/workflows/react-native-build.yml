name: React Native Android Build

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID'
        required: true
      hospitalName:
        description: 'Hospital Name'
        required: true
      applicationId:
        description: 'Android Application ID (e.g. com.medical365.xyz)'
        required: true
      logoUrl:
        description: 'URL of the Hospital Logo'
        required: true
      themeColor:
        description: 'Primary Theme Color Hex (e.g. #14b8a6)'
        required: true
      rnBuildId:
        description: 'RN Build Correlation ID'
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rn-build-${{ github.event.inputs.tenantId }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Inputs
        env:
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
          APP_ID: ${{ github.event.inputs.applicationId }}
          THEME_COLOR: ${{ github.event.inputs.themeColor }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$TENANT_ID" ]; then
            echo "::error::tenantId is required and cannot be empty"
            exit 1
          fi

          if [ -z "$HOSPITAL_NAME" ]; then
            echo "::error::hospitalName is required and cannot be empty"
            exit 1
          fi

          if ! [[ "$APP_ID" =~ ^com\.medical365\.[a-z][a-z0-9_]*$ ]]; then
            echo "::error::Invalid applicationId. Expected com.medical365.<lowercase-segment>."
            exit 1
          fi

          if ! [[ "$THEME_COLOR" =~ ^#[0-9a-fA-F]{6}$ ]]; then
            echo "::error::Invalid themeColor. Expected #RRGGBB."
            exit 1
          fi

          if ! [[ "$RN_BUILD_ID" =~ ^rn-[0-9]+-[a-f0-9]{8}$ ]]; then
            echo "::error::Invalid rnBuildId format."
            exit 1
          fi

          echo "Input validation passed."
          echo "Received and validated rnBuildId: $RN_BUILD_ID"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./HMS-REACT-NATIVE
        run: npm ci

      - name: Update app.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const hospitalName = context.payload.inputs.hospitalName;
            const applicationId = context.payload.inputs.applicationId;
            const tenantId = context.payload.inputs.tenantId;

            if (!fs.existsSync(appJsonPath)) {
              core.setFailed(`app.json not found at ${appJsonPath}`);
              return;
            }

            let config;
            try {
              config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            } catch (error) {
              core.setFailed(`Failed to parse app.json: ${error.message}`);
              return;
            }

            if (!config.expo) config.expo = {};

            config.expo.name = hospitalName;

            let slug = String(hospitalName)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');

            if (!slug) {
              const safeTenant = String(tenantId)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
              slug = `hospital-${safeTenant || 'app'}`;
            }

            slug = slug.substring(0, 50).replace(/-+$/, '') || 'hospital-app';
            config.expo.slug = slug;

            // Wire app icon to white-label asset
            config.expo.icon = './assets/icon.png';

            if (!config.expo.android) config.expo.android = {};
            config.expo.android.package = applicationId;
            config.expo.android.icon = './assets/icon.png';

            // Ensure adaptiveIcon does not override hospital logo with a default icon
            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }
            config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            if (config.expo.ios) {
              config.expo.ios.bundleIdentifier = applicationId;
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Updated app.json: name=${hospitalName}, slug=${slug}, package=${applicationId}, icon=${config.expo.icon}`);

            // Inject white-label tenant identity into src/tenant.js
            const tenantJsPath = 'HMS-REACT-NATIVE/src/tenant.js';
            const escapedName = hospitalName.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const tenantCode = `export const HARDCODED_TENANT = { tenantId: "${tenantId}", slug: "${slug}", name: "${escapedName}" };\n`;
            fs.writeFileSync(tenantJsPath, tenantCode);
            core.info(`Injected white-label tenant config to ${tenantJsPath}: ${tenantCode.trim()}`);

            core.exportVariable('EXPO_PUBLIC_HOSPITAL_NAME', hospitalName);
            core.exportVariable('EXPO_PUBLIC_TENANT_SLUG', slug);
            core.exportVariable('APPLICATION_ID', applicationId);

      - name: Download & Process Logo
        working-directory: ./HMS-REACT-NATIVE
        env:
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
        run: |
          set -euo pipefail
          node scripts/prepare-launcher-icons.js "${LOGO_URL}" --clean-mipmaps --generate-native-res

      - name: Verify and Apply App Icons in app.json
        uses: actions/github-script@v7
        env:
          SELECTED_ICON_SOURCE: ${{ env.SELECTED_ICON_SOURCE }}
        with:
          script: |
            const fs = require('fs');

            const appJsonPath = 'HMS-REACT-NATIVE/app.json';
            const iconPath = 'HMS-REACT-NATIVE/assets/icon.png';
            const adaptivePath = 'HMS-REACT-NATIVE/assets/adaptive-icon.png';
            const selectedSource = process.env.SELECTED_ICON_SOURCE || 'UNKNOWN';

            if (!fs.existsSync(iconPath) || fs.statSync(iconPath).size === 0) {
              core.setFailed(`Required icon asset missing or empty at ${iconPath}`);
              return;
            }

            if (!fs.existsSync(adaptivePath) || fs.statSync(adaptivePath).size === 0) {
              core.setFailed(`Required adaptive icon asset missing or empty at ${adaptivePath}`);
              return;
            }

            core.info(`Icon validation passed: ${iconPath} (${fs.statSync(iconPath).size} bytes), ${adaptivePath} (${fs.statSync(adaptivePath).size} bytes) for source=${selectedSource}`);

            let config = JSON.parse(fs.readFileSync(appJsonPath, 'utf8'));
            if (!config.expo) config.expo = {};
            if (!config.expo.android) config.expo.android = {};

            config.expo.icon = './assets/icon.png';
            config.expo.android.icon = './assets/icon.png';

            if (!config.expo.android.adaptiveIcon) {
              config.expo.android.adaptiveIcon = {};
            }

            config.expo.android.adaptiveIcon.foregroundImage = './assets/adaptive-icon.png';
            if (!config.expo.android.adaptiveIcon.backgroundColor) {
              config.expo.android.adaptiveIcon.backgroundColor = '#ffffff';
            }

            fs.writeFileSync(appJsonPath, JSON.stringify(config, null, 2) + '\n');
            core.info(`Configured app.json launcher icons for source=${selectedSource}: icon=${config.expo.icon}, adaptiveForeground=${config.expo.android.adaptiveIcon.foregroundImage}, adaptiveBg=${config.expo.android.adaptiveIcon.backgroundColor}`);

      - name: Build APK and AAB via Expo Prebuild
        id: build_release
        working-directory: ./HMS-REACT-NATIVE
        env:
          EXPO_PUBLIC_TENANT_ID: ${{ github.event.inputs.tenantId }}
          EXPO_PUBLIC_HOSPITAL_NAME: ${{ github.event.inputs.hospitalName }}
          EXPO_PUBLIC_TENANT_SLUG: ${{ env.EXPO_PUBLIC_TENANT_SLUG }}
          APPLICATION_ID: ${{ github.event.inputs.applicationId }}
          EXPO_PUBLIC_API_URL: https://hms-n6nk.onrender.com
          EXPO_PUBLIC_THEME_COLOR: ${{ github.event.inputs.themeColor }}
          LOGO_URL: ${{ github.event.inputs.logoUrl }}
        run: |
          set -euo pipefail

          printf 'EXPO_PUBLIC_TENANT_ID=%s\n' "$EXPO_PUBLIC_TENANT_ID" > .env.local
          printf 'EXPO_PUBLIC_HOSPITAL_NAME=%s\n' "$EXPO_PUBLIC_HOSPITAL_NAME" >> .env.local
          printf 'EXPO_PUBLIC_TENANT_SLUG=%s\n' "$EXPO_PUBLIC_TENANT_SLUG" >> .env.local
          printf 'APPLICATION_ID=%s\n' "$APPLICATION_ID" >> .env.local
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" >> .env.local
          printf 'EXPO_PUBLIC_THEME_COLOR=%s\n' "$EXPO_PUBLIC_THEME_COLOR" >> .env.local

          # Clean any stale mipmap icons before expo prebuild to ensure tenant isolation
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*

          npx expo prebuild --platform android --clean --no-install

          # Ensure authoritative launcher mipmaps are placed directly in native Android resources
          node scripts/prepare-launcher-icons.js "${LOGO_URL}" --clean-mipmaps --generate-native-res

          cd android
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Find and Move Artifacts
        id: collect_artifacts
        run: |
          set -euo pipefail

          mkdir -p output_artifacts

          APK_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FOUND" ] || [ ! -s "$APK_FOUND" ]; then
            echo "::error::Release APK was not generated or is empty"
            exit 1
          fi
          cp "$APK_FOUND" output_artifacts/app-rn.apk

          AAB_FOUND=$(find HMS-REACT-NATIVE/android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          if [ -z "$AAB_FOUND" ] || [ ! -s "$AAB_FOUND" ]; then
            echo "::error::Release AAB was not generated or is empty"
            exit 1
          fi
          cp "$AAB_FOUND" output_artifacts/app-rn.aab

          file output_artifacts/app-rn.apk output_artifacts/app-rn.aab
          ls -lh output_artifacts/

      - name: Upload Build Artifacts (APK and AAB)
        id: upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hospital-rn-app-${{ github.event.inputs.tenantId }}-${{ github.event.inputs.rnBuildId }}
          path: |
            output_artifacts/app-rn.apk
            output_artifacts/app-rn.aab
          if-no-files-found: error

      - name: Upload Build Artifacts to Backend (Phase 1)
        id: upload_artifacts_backend
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          if [ ! -s "output_artifacts/app-rn.apk" ] || [ ! -s "output_artifacts/app-rn.aab" ]; then
            echo "::error::Required APK/AAB artifacts are missing or empty"
            exit 1
          fi

          echo "Phase 1: Uploading APK/AAB with rnBuildId: $RN_BUILD_ID..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rn-upload-response.txt \
            -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 90 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn/upload-build?secret=${WEBHOOK_SECRET}&tenantId=${TENANT_ID}&rnBuildId=${RN_BUILD_ID}" \
            -F "apk=@output_artifacts/app-rn.apk" \
            -F "aab=@output_artifacts/app-rn.aab" \
            -F "tenantId=${TENANT_ID}" \
            -F "rnBuildId=${RN_BUILD_ID}")

          echo "Upload HTTP status: $HTTP_STATUS"
          echo "Upload response:"
          cat /tmp/rn-upload-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::RN upload-build webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Phase 1 upload completed successfully (build status is PROCESSING)."

      - name: Final Completion Callback (Phase 2)
        id: notify_completed
        if: success()
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          echo "Phase 2: Sending final completion callback for rnBuildId: $RN_BUILD_ID..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/rn-completed-response.txt \
            -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn?secret=${WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"tenantId\":\"${TENANT_ID}\",\"rnBuildId\":\"${RN_BUILD_ID}\",\"status\":\"COMPLETED\"}")

          echo "Completion callback HTTP status: $HTTP_STATUS"
          echo "Completion callback response:"
          cat /tmp/rn-completed-response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::RN completion webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Phase 2 completion callback acknowledged by backend. Build is now COMPLETED."

      - name: Notify Backend Webhook (Failure)
        if: failure() && steps.notify_completed.outcome != 'success'
        env:
          WEBHOOK_SECRET: ${{ secrets.RN_WEBHOOK_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenantId }}
          RN_BUILD_ID: ${{ github.event.inputs.rnBuildId }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error::RN_WEBHOOK_SECRET is not configured"
            exit 1
          fi

          echo "Sending failure webhook for rnBuildId: $RN_BUILD_ID"

          curl -f -sS \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 60 \
            -X POST \
            "https://hms-n6nk.onrender.com/api/superadmin/hospitals/webhook/github-rn?secret=${WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"tenantId\":\"${TENANT_ID}\",\"rnBuildId\":\"${RN_BUILD_ID}\",\"status\":\"FAILED\",\"error\":\"RN GitHub Action workflow failed\"}"
